name: Build Kashtbhanjan Motors Invoice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Project Files
        run: |
          test -s www/index.html
          test -s package.json
          test -s capacitor.config.json
          test -s validate.mjs
          echo "Project files found successfully."

      - name: Validate App Source
        run: node validate.mjs

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Local PDF Libraries
        run: |
          mkdir -p www
          cp node_modules/html2canvas/dist/html2canvas.min.js www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/

          node <<'NODE'
          const fs = require('fs');
          const file = 'www/index.html';
          let html = fs.readFileSync(file, 'utf8');

          if (!html.includes('html2canvas.min.js')) {
            html = html.replace(
              /<\/head>/i,
              '<script src="html2canvas.min.js"></script>\n<script src="jspdf.umd.min.js"></script>\n</head>'
            );
          }

          if (!html.includes('</head>')) {
            throw new Error('HTML head section not found.');
          }

          fs.writeFileSync(file, html);
          console.log('Local PDF libraries prepared.');
          NODE

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kashtbhanjan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kashtbhanjan-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
