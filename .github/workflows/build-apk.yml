name: Build Kashtbhanjan Motors Invoice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate project files
        run: |
          test -s www/index.html
          test -f package.json
          test -f capacitor.config.json
          test -f validate.mjs
          node validate.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle invoice libraries
        run: |
          cp node_modules/html2canvas/dist/html2canvas.min.js www/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/jspdf.umd.min.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'www/index.html';
          let s = fs.readFileSync(p, 'utf8');
          if (!s.includes('src="html2canvas.min.js"')) {
            s = s.replace('</head>', '<script src="html2canvas.min.js"></script><script src="jspdf.umd.min.js"></script></head>');
          }
          fs.writeFileSync(p, s);
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kashtbhanjan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kashtbhanjan-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
